apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudflareaccounts.tunnelgate.geeko.me
spec:
  group: tunnelgate.geeko.me
  names:
    categories:
    - tunnelgate
    kind: CloudflareAccount
    plural: cloudflareaccounts
    shortNames:
    - cfa
    singular: cloudflareaccount
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.accountId
      name: Account ID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Cluster-scoped Cloudflare account credentials shared by namespaced resources.
        properties:
          spec:
            description: |-
              A Cloudflare account and its credentials, usable from other resources via
              `cloudflare.accountRef`.
            properties:
              accountId:
                nullable: true
                type: string
              accountName:
                nullable: true
                type: string
              allowedNamespaces:
                description: |-
                  Namespaces whose resources may use this account; `*` allows all. Default: only the
                  credentials Secret's namespace.
                items:
                  type: string
                type: array
              credentialsSecretRef:
                properties:
                  key:
                    description: Defaults to `CLOUDFLARE_API_TOKEN`.
                    nullable: true
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                - namespace
                type: object
            required:
            - credentialsSecretRef
            type: object
            x-kubernetes-validations:
            - message: set exactly one of accountId or accountName
              rule: has(self.accountId) != has(self.accountName)
          status:
            nullable: true
            properties:
              accountId:
                nullable: true
                type: string
              conditions:
                items:
                  description: >-
                    Condition contains details for one aspect of the current state of this API
                    Resource.
                  properties:
                    lastTransitionTime:
                      description: >-
                        lastTransitionTime is the last time the condition transitioned from one status
                        to another. This should be when the underlying condition changed.  If that is not
                        known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: >-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      type: string
                    observedGeneration:
                      description: >-
                        observedGeneration represents the .metadata.generation that the condition was
                        set based upon. For instance, if .metadata.generation is currently 12, but the
                        .status.conditions[x].observedGeneration is 9, the condition is out of date with
                        respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: >-
                        reason contains a programmatic identifier indicating the reason for the
                        condition's last transition. Producers of specific condition types may define expected
                        values and meanings for this field, and whether the values are considered a
                        guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                nullable: true
                type: integer
            type: object
        required:
        - spec
        title: CloudflareAccount
        type: object
    served: true
    storage: true
    subresources:
      status: {}
