{{- if and .Values.gatewayClass.create (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/GatewayClass") }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayClass.name }}
  labels:
    {{- include "tunnelgate.labels" . | nindent 4 }}
spec:
  controllerName: tunnelgate.geeko.me/tunnel
  description: Publishes HTTPRoutes through a Cloudflare Tunnel (tunnelgate)
{{- end }}
