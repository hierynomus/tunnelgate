# On a version tag (v1.2.3): multi-arch image, SBOM, cosign keyless signatures, OCI Helm chart
# pinned to the image digest, and a GitHub release with the CLI, crds.yaml and checksums.
#
# Verify an image:
#   cosign verify ghcr.io/hierynomus/tunnelgate:1.2.3 \
#     --certificate-identity-regexp '^https://github.com/hierynomus/tunnelgate/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tunnelgate
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the GitHub release
      packages: write   # image and chart in ghcr.io
      id-token: write   # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tag is the version: binaries, image, chart and release all take it from here.
      - name: Version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not a version (vMAJOR.MINOR.PATCH[-PRERELEASE])"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # No caches (tools or build): nothing a CI run wrote ends up in a signed release.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false

      - run: mise run lint
      - run: mise run test
      - name: Release assets
        run: mise run dist
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Sign the image and attach the SBOM
        env:
          REF: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
        run: |
          syft scan "registry:$REF" -o spdx-json=target/dist/tunnelgate.sbom.spdx.json
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate target/dist/tunnelgate.sbom.spdx.json "$REF"

      - name: Chart pinned to the image digest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          rm target/dist/tunnelgate-*.tgz
          sed -i "s|^  digest: \"\"|  digest: \"$DIGEST\"|" charts/tunnelgate/values.yaml
          grep -q "digest: \"$DIGEST\"" charts/tunnelgate/values.yaml
          helm package charts/tunnelgate --version "$VERSION" --app-version "$VERSION" --destination target/dist
          # helm push uses the docker/login-action credentials (Helm falls back to ~/.docker/config.json)
          pushed=$(helm push "target/dist/tunnelgate-$VERSION.tgz" "$CHART_REPO" 2>&1 | tee /dev/stderr | awk '/^Digest:/ {print $2}')
          cosign sign --yes "${CHART_REPO#oci://}/tunnelgate@$pushed"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd target/dist
          sha256sum -- *.tar.gz *.tgz crds.yaml tunnelgate.sbom.spdx.json > checksums.txt
          cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "tunnelgate $VERSION" -- *
