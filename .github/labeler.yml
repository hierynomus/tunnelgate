# Path-based PR labels (actions/labeler); title-based ones are in workflows/labeler.yml.
dependencies:
  - changed-files:
      - any-glob-to-any-file: [Cargo.lock, mise.toml, deny.toml]

infrastructure:
  - changed-files:
      - any-glob-to-any-file: [".github/**", Dockerfile, .dockerignore]

documentation:
  - changed-files:
      - all-globs-to-all-files: ["**/*.md"]
