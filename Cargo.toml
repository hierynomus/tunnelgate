[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# Placeholder: release versions come from the git tag (see .github/workflows/release.yml).
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/hierynomus/tunnelgate"

[workspace.dependencies]
tunnelgate-api = { version = "0.0.0-dev", path = "crates/tunnelgate-api" }
tunnelgate-cf = { version = "0.0.0-dev", path = "crates/tunnelgate-cf", default-features = false }
tunnelgate-cf-fake = { version = "0.0.0-dev", path = "crates/tunnelgate-cf-fake" }
tunnelgate-render = { version = "0.0.0-dev", path = "crates/tunnelgate-render" }
tunnelgate-cli = { version = "0.0.0-dev", path = "crates/tunnelgate-cli" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4.6", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
jiff = "0.2"
insta = { version = "1.49", features = ["yaml", "json"] }
k8s-openapi = { version = "0.28", default-features = false }
kube = { version = "4.2", default-features = false, features = ["client", "derive", "runtime", "rustls-tls"] }
rand = "0.10"
rcgen = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
schemars = "1.2"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2.0", default-features = false, features = ["serialize"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "time", "net", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
