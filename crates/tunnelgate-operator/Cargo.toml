[package]
name = "tunnelgate-operator"
description = "tunnelgate controllers and the tunnelgate-operator binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "tunnelgate-operator"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
k8s-openapi = { workspace = true, features = ["v1_32"] }
kube = { workspace = true, features = ["unstable-runtime"] }
rand = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tunnelgate-api = { workspace = true }
tunnelgate-cf = { workspace = true, features = ["client"] }
tunnelgate-render = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true }
tunnelgate-cli = { workspace = true }
tunnelgate-cf-fake = { workspace = true }
